<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 820" width="100%" height="100%" style="background:#f8fafc; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#334155" />
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="675" y="45" text-anchor="middle" font-size="24" font-weight="800" fill="#0f172a" letter-spacing="0.5">HOSPITAL PATIENT &amp; APPOINTMENT MANAGEMENT SYSTEM</text>
  <text x="675" y="75" text-anchor="middle" font-size="14" font-weight="500" fill="#64748b">Entity-Relationship (ER) Diagram with Cardinality (1:M) &amp; Participation Constraints (Total / Partial)</text>

  <!-- ================= ENTITY: DEPARTMENT ================= -->
  <g transform="translate(60, 140)" filter="url(#shadow)">
    <rect width="250" height="180" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <path d="M 0 10 Q 0 0 10 0 L 240 0 Q 250 0 250 10 L 250 42 L 0 42 Z" fill="#1e40af"/>
    <text x="125" y="27" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff" letter-spacing="0.5">DEPARTMENT</text>
    
    <!-- Attributes -->
    <text x="20" y="70" font-size="13" font-weight="bold" fill="#b45309">[PK] department_id <tspan font-weight="normal" fill="#64748b">(SERIAL)</tspan></text>
    <line x1="20" y1="73" x2="168" y2="73" stroke="#b45309" stroke-width="1.2"/>
    
    <text x="20" y="105" font-size="13" font-weight="bold" fill="#047857">[CK] department_name <tspan font-weight="normal" fill="#64748b">(VARCHAR)</tspan></text>
    <text x="20" y="140" font-size="13" font-weight="500" fill="#334155">• floor_number <tspan font-weight="normal" fill="#64748b">(INT)</tspan></text>
  </g>

  <!-- ================= ENTITY: DOCTOR ================= -->
  <g transform="translate(540, 120)" filter="url(#shadow)">
    <rect width="270" height="220" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <path d="M 0 10 Q 0 0 10 0 L 260 0 Q 270 0 270 10 L 270 42 L 0 42 Z" fill="#1e40af"/>
    <text x="135" y="27" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff" letter-spacing="0.5">DOCTOR</text>
    
    <!-- Attributes -->
    <text x="20" y="70" font-size="13" font-weight="bold" fill="#b45309">[PK] doctor_id <tspan font-weight="normal" fill="#64748b">(SERIAL)</tspan></text>
    <line x1="20" y1="73" x2="135" y2="73" stroke="#b45309" stroke-width="1.2"/>

    <text x="20" y="102" font-size="13" font-weight="bold" fill="#0369a1">[FK] department_id <tspan font-weight="normal" fill="#64748b">(INT)</tspan></text>
    <text x="20" y="134" font-size="13" font-weight="bold" fill="#047857">[CK] email <tspan font-weight="normal" fill="#64748b">(VARCHAR 100)</tspan></text>
    <text x="20" y="166" font-size="13" font-weight="500" fill="#334155">• specialization <tspan font-weight="normal" fill="#64748b">(VARCHAR)</tspan></text>
    <text x="20" y="198" font-size="13" font-weight="500" fill="#334155">• consultation_fee <tspan font-weight="normal" fill="#64748b">(NUMERIC)</tspan></text>
  </g>

  <!-- ================= ENTITY: PATIENT ================= -->
  <g transform="translate(60, 480)" filter="url(#shadow)">
    <rect width="250" height="190" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <path d="M 0 10 Q 0 0 10 0 L 240 0 Q 250 0 250 10 L 250 42 L 0 42 Z" fill="#1e40af"/>
    <text x="125" y="27" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff" letter-spacing="0.5">PATIENT</text>
    
    <!-- Attributes -->
    <text x="20" y="70" font-size="13" font-weight="bold" fill="#b45309">[PK] patient_id <tspan font-weight="normal" fill="#64748b">(SERIAL)</tspan></text>
    <line x1="20" y1="73" x2="140" y2="73" stroke="#b45309" stroke-width="1.2"/>

    <text x="20" y="105" font-size="13" font-weight="bold" fill="#047857">[CK] phone <tspan font-weight="normal" fill="#64748b">(VARCHAR 15)</tspan></text>
    <text x="20" y="140" font-size="13" font-weight="500" fill="#334155">• medical_details <tspan font-weight="normal" fill="#64748b">(JSONB)</tspan></text>
    <text x="35" y="162" font-size="11" fill="#64748b">└ blood_group, allergies, contact</text>
  </g>

  <!-- ================= ENTITY: APPOINTMENT ================= -->
  <g transform="translate(520, 450)" filter="url(#shadow)">
    <rect width="310" height="240" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <path d="M 0 10 Q 0 0 10 0 L 300 0 Q 310 0 310 10 L 310 42 L 0 42 Z" fill="#1e40af"/>
    <text x="155" y="27" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff" letter-spacing="0.5">APPOINTMENT</text>
    
    <!-- Attributes -->
    <text x="15" y="70" font-size="12.5" font-weight="bold" fill="#b45309">[PK] appointment_id <tspan font-weight="normal" fill="#64748b">(SERIAL)</tspan></text>
    <line x1="15" y1="73" x2="165" y2="73" stroke="#b45309" stroke-width="1.2"/>

    <text x="15" y="98" font-size="12.5" font-weight="bold" fill="#0369a1">[FK] patient_id <tspan font-weight="normal" fill="#64748b">(INT)</tspan></text>
    <text x="15" y="126" font-size="12.5" font-weight="bold" fill="#0369a1">[FK, CK*] doctor_id <tspan font-weight="normal" fill="#64748b">(INT)</tspan></text>
    <text x="15" y="154" font-size="12.5" font-weight="bold" fill="#047857">[CK*] appointment_date <tspan font-weight="normal" fill="#64748b">(DATE)</tspan></text>
    <text x="15" y="182" font-size="12.5" font-weight="bold" fill="#047857">[CK*] appointment_time <tspan font-weight="normal" fill="#64748b">(TIME)</tspan></text>
    <text x="15" y="210" font-size="12.5" font-weight="500" fill="#334155">• status <tspan font-weight="normal" fill="#64748b">(VARCHAR 20)</tspan></text>
    <text x="15" y="228" font-size="10.5" font-style="italic" fill="#047857">* Composite CK: (doctor_id, date, time)</text>
  </g>

  <!-- ================= ENTITY: PRESCRIPTION ================= -->
  <g transform="translate(1020, 480)" filter="url(#shadow)">
    <rect width="270" height="190" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <path d="M 0 10 Q 0 0 10 0 L 260 0 Q 270 0 270 10 L 270 42 L 0 42 Z" fill="#1e40af"/>
    <text x="135" y="27" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff" letter-spacing="0.5">PRESCRIPTION</text>
    
    <!-- Attributes -->
    <text x="20" y="70" font-size="13" font-weight="bold" fill="#b45309">[PK] prescription_id <tspan font-weight="normal" fill="#64748b">(SERIAL)</tspan></text>
    <line x1="20" y1="73" x2="165" y2="73" stroke="#b45309" stroke-width="1.2"/>

    <text x="20" y="105" font-size="13" font-weight="bold" fill="#0369a1">[FK] appointment_id <tspan font-weight="normal" fill="#64748b">(INT)</tspan></text>
    <text x="20" y="140" font-size="13" font-weight="500" fill="#334155">• medicine_name <tspan font-weight="normal" fill="#64748b">(VARCHAR 100)</tspan></text>
    <text x="20" y="170" font-size="13" font-weight="500" fill="#334155">• dosage <tspan font-weight="normal" fill="#64748b">(VARCHAR 50)</tspan></text>
  </g>

  <!-- ================= RELATIONSHIP DIAMONDS ================= -->
  <!-- 1. Department - Doctor: Employs / Has -->
  <g transform="translate(425, 230)">
    <polygon points="0,-32 55,0 0,32 -55,0" fill="#ede9fe" stroke="#6366f1" stroke-width="2.2" filter="url(#shadow)"/>
    <text x="0" y="5" text-anchor="middle" font-size="12" font-weight="bold" fill="#4338ca">Employs</text>
  </g>

  <!-- 2. Doctor - Appointment: Conducts / Consults -->
  <g transform="translate(675, 395)">
    <polygon points="0,-30 55,0 0,30 -55,0" fill="#ede9fe" stroke="#6366f1" stroke-width="2.2" filter="url(#shadow)"/>
    <text x="0" y="5" text-anchor="middle" font-size="12" font-weight="bold" fill="#4338ca">Conducts</text>
  </g>

  <!-- 3. Patient - Appointment: Books -->
  <g transform="translate(415, 575)">
    <polygon points="0,-32 50,0 0,32 -50,0" fill="#ede9fe" stroke="#6366f1" stroke-width="2.2" filter="url(#shadow)"/>
    <text x="0" y="5" text-anchor="middle" font-size="12" font-weight="bold" fill="#4338ca">Books</text>
  </g>

  <!-- 4. Appointment - Prescription: Issues / Generates -->
  <g transform="translate(925, 575)">
    <polygon points="0,-32 50,0 0,32 -50,0" fill="#ede9fe" stroke="#6366f1" stroke-width="2.2" filter="url(#shadow)"/>
    <text x="0" y="5" text-anchor="middle" font-size="12" font-weight="bold" fill="#4338ca">Generates</text>
  </g>

  <!-- ================= CONNECTOR LINES & PARTICIPATION ================= -->
  <!-- Department (1, Partial) to Employs Diamond -->
  <line x1="310" y1="230" x2="370" y2="230" stroke="#334155" stroke-width="2.5"/>
  <rect x="315" y="202" width="48" height="20" rx="4" fill="#f1f5f9"/>
  <text x="339" y="216" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">1 (Part.)</text>

  <!-- Employs Diamond to Doctor (M, Total: double line) -->
  <line x1="480" y1="228" x2="540" y2="228" stroke="#dc2626" stroke-width="2"/>
  <line x1="480" y1="233" x2="540" y2="233" stroke="#dc2626" stroke-width="2"/>
  <rect x="483" y="202" width="55" height="20" rx="4" fill="#fee2e2"/>
  <text x="510" y="216" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626">M (Total)</text>

  <!-- Doctor (1, Partial) to Conducts Diamond -->
  <line x1="675" y1="340" x2="675" y2="365" stroke="#334155" stroke-width="2.5"/>
  <rect x="682" y="342" width="50" height="20" rx="4" fill="#f1f5f9"/>
  <text x="707" y="356" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">1 (Part.)</text>

  <!-- Conducts Diamond to Appointment (M, Total: double line) -->
  <line x1="672" y1="425" x2="672" y2="450" stroke="#dc2626" stroke-width="2"/>
  <line x1="678" y1="425" x2="678" y2="450" stroke="#dc2626" stroke-width="2"/>
  <rect x="684" y="426" width="55" height="20" rx="4" fill="#fee2e2"/>
  <text x="711" y="440" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626">M (Total)</text>

  <!-- Patient (1, Partial) to Books Diamond -->
  <line x1="310" y1="575" x2="365" y2="575" stroke="#334155" stroke-width="2.5"/>
  <rect x="315" y="548" width="48" height="20" rx="4" fill="#f1f5f9"/>
  <text x="339" y="562" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">1 (Part.)</text>

  <!-- Books Diamond to Appointment (M, Total: double line) -->
  <line x1="465" y1="572" x2="520" y2="572" stroke="#dc2626" stroke-width="2"/>
  <line x1="465" y1="577" x2="520" y2="577" stroke="#dc2626" stroke-width="2"/>
  <rect x="466" y="548" width="55" height="20" rx="4" fill="#fee2e2"/>
  <text x="493" y="562" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626">M (Total)</text>

  <!-- Appointment (1, Partial) to Generates Diamond -->
  <line x1="830" y1="575" x2="875" y2="575" stroke="#334155" stroke-width="2.5"/>
  <rect x="831" y="548" width="48" height="20" rx="4" fill="#f1f5f9"/>
  <text x="855" y="562" text-anchor="middle" font-size="11" font-weight="bold" fill="#0f172a">1 (Part.)</text>

  <!-- Generates Diamond to Prescription (M, Total: double line) -->
  <line x1="975" y1="572" x2="1020" y2="572" stroke="#dc2626" stroke-width="2"/>
  <line x1="975" y1="577" x2="1020" y2="577" stroke="#dc2626" stroke-width="2"/>
  <rect x="972" y="548" width="55" height="20" rx="4" fill="#fee2e2"/>
  <text x="999" y="562" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626">M (Total)</text>

  <!-- ================= LEGEND & NOTES ================= -->
  <g transform="translate(60, 720)">
    <rect width="1230" height="75" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    
    <text x="25" y="28" font-size="13" font-weight="bold" fill="#0f172a">LEGEND &amp; CONSTRAINTS:</text>
    
    <text x="25" y="55" font-size="12" font-weight="bold" fill="#b45309">[PK] Primary Key</text>
    <text x="160" y="55" font-size="12" font-weight="bold" fill="#0369a1">[FK] Foreign Key</text>
    <text x="290" y="55" font-size="12" font-weight="bold" fill="#047857">[CK] Candidate Key</text>

    <!-- Single line note -->
    <line x1="440" y1="51" x2="480" y2="51" stroke="#334155" stroke-width="2.5"/>
    <text x="490" y="55" font-size="12" font-weight="600" fill="#334155">Single Line = Partial Participation (0..M or optional)</text>

    <!-- Double line note -->
    <line x1="840" y1="49" x2="880" y2="49" stroke="#dc2626" stroke-width="2"/>
    <line x1="840" y1="54" x2="880" y2="54" stroke="#dc2626" stroke-width="2"/>
    <text x="890" y="55" font-size="12" font-weight="bold" fill="#dc2626">Double Line = Total Participation (Mandatory 1..M)</text>
  </g>
</svg>
